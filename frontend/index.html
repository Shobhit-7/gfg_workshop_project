<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Resume Analyzer</h1>
            <p>Upload your resume to get instant feedback and score</p>
        </header>

        <main>
            <div class="upload-card">
                <form id="uploadForm">
                    <div class="file-input-wrapper">
                        <label for="resumeInput" class="file-label">
                            <span class="icon">📄</span>
                            <span id="fileName">Select PDF Resume</span>
                        </label>
                        <input type="file" id="resumeInput" accept=".pdf" required>
                    </div>
                    <button type="submit" id="submitBtn">Analyze Resume</button>
                </form>
                
                <div id="loader" class="loader-container hidden">
                    <div class="spinner"></div>
                    <p>Analyzing your resume...</p>
                </div>
            </div>

            <div id="resultSection" class="result-card hidden">
                <div class="score-container">
                    <h2>Your Resume Score</h2>
                    <div class="progress-circle">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg"
                              d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <path class="circle" id="scoreCircle"
                              stroke-dasharray="0, 100"
                              d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <text x="18" y="20.35" class="percentage" id="scoreText">0</text>
                        </svg>
                    </div>
                </div>

                <div class="details-container">
                    <div class="section">
                        <h3>Key Skills Extracted</h3>
                        <div id="skillsList" class="tags-container"></div>
                    </div>

                    <div class="section">
                        <h3>Experience Level</h3>
                        <p id="experienceLevel" class="text-highlight"></p>
                    </div>

                    <div class="section">
                        <h3>Suggestions for Improvement</h3>
                        <ul id="suggestionsList" class="suggestions-list"></ul>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Made by Shobhit Shukla</p>
        </footer>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
